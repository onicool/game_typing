<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>白翼の旅 · 空と祈り</title></head>
<body><div id="angel-ui-studio"><div class="av-app" id="angel-app"><header class="av-chrome"><span class="av-brand">白翼の旅 <small>空と祈り</small></span><nav aria-label="ゲームの画面"><button type="button" data-view="characters">天使</button><button type="button" data-view="journey">旅の地図</button><button type="button" data-view="training">練習</button><button type="button" data-view="records">記録</button></nav><button type="button" class="av-action" data-action="settings" id="open-settings">設定</button></header><main class="av-main" id="angel-main"></main><p class="av-storage" id="settings-storage-state" role="status" hidden></p></div>
<section class="av-modal" id="pause-dialog" role="dialog" aria-modal="true" aria-labelledby="pause-title" aria-describedby="pause-note" tabindex="-1" hidden><div class="av-modal-box"><p class="av-eyebrow">ひと息つこう</p><h2 id="pause-title">一時停止</h2><p id="pause-note"></p><div class="av-modal-actions"><button type="button" class="av-action primary" data-action="resume" id="pause-resume">続きを打つ</button><button type="button" class="av-action" data-action="finish" id="pause-finish">終了して記録を保存</button><button type="button" class="av-action" data-action="retry" id="pause-retry">やり直す（未保存分は残りません）</button><button type="button" class="av-action" data-action="map" id="pause-map">地図へ戻る（未保存分は残りません）</button></div></div></section>
<section class="av-modal" id="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-describedby="settings-save-state" tabindex="-1" hidden><div class="av-modal-box"><p class="av-eyebrow">自分のペースで</p><h2 id="settings-title">演出と音声</h2><p id="settings-save-state" role="status" hidden></p><div class="av-modal-actions"><button type="button" class="av-action" data-action="motion">前進と突破の動き <b id="setting-motion"></b></button><button type="button" class="av-action" data-action="graphics">描画の負荷 <b id="setting-graphics"></b></button><button type="button" class="av-action" data-action="sound" id="sound-toggle">効果音 <b id="setting-sound"></b></button><label class="av-volume">音量 <input type="range" id="sound-volume" min="0" max="1" step="0.05" aria-label="音量"></label><button type="button" class="av-action primary" data-action="close-settings" id="close-settings">戻る</button></div><p class="av-footnote">動きを減らすOS設定も尊重します。音声が使えなくても入力と保存は続けられます。</p></div></section>
</div><script type="module" src="/src/angel/main.ts"></script></body></html>
